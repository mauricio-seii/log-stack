input {
  udp {
    port => 5000
    codec => json_lines
  }
}

filter {
  json {
    source => "message"
    skip_on_invalid_json => true
  }

  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{DATA:thread}\] %{LOGLEVEL:level}\s+%{DATA:logger} \[dd.trace_id=%{DATA:dd_trace_id} dd.span_id=%{DATA:dd_span_id}\] - %{GREEDYDATA:log}"
    }
    overwrite => ["message"]
    tag_on_failure => ["_grokparsefailure"]
  }

}

output {
  stdout { codec => rubydebug }
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "dev-logs-%{+YYYY.MM.dd}"
  }
}
